# Netlify: build settings for Konvene. Nothing to change here; settings go in
# Site configuration > Environment variables (see .env.example).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Redirects (call links, /api/turn) live in public/_redirects.

# Response headers (security and caching) live in public/_headers, shared with Cloudflare Pages.

# The public demo moved to https://konvene.app (Cloudflare Pages). Old links to the
# Netlify copy go there. This only matches that one hostname, so forks are unaffected.
[[redirects]]
  from = "https://konvene-calls.netlify.app/*"
  to = "https://konvene.app/:splat"
  status = 301
  force = true
